<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NF for Twitch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="../../icons/icon48.png" alt="" width="32" height="32" />
      <div class="brand">
        <h1>NF for Twitch</h1>
        <p id="summary" class="summary">Pin your favorite streamers</p>
      </div>
      <span id="version" class="version"></span>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-favorites" aria-controls="panel-favorites" aria-selected="true">
        Favorites <span id="fav-count" class="count"></span>
      </button>
      <button role="tab" id="tab-features" aria-controls="panel-features" aria-selected="false" tabindex="-1">Features</button>
      <button role="tab" id="tab-soon" aria-controls="panel-soon" aria-selected="false" tabindex="-1">Coming soon</button>
    </nav>

    <main>
      <section id="panel-favorites" role="tabpanel" aria-labelledby="tab-favorites">
        <div class="platforms segmented" role="group" aria-label="Platform">
          <button type="button" data-platform="twitch" aria-pressed="true">Twitch <span id="count-twitch" class="count"></span></button>
          <button type="button" data-platform="kick" aria-pressed="false"><span class="kick-mark" aria-hidden="true">K</span>Kick <span id="count-kick" class="count"></span></button>
        </div>
        <form id="add-form" class="add" autocomplete="off">
          <label class="sr-only" for="add-input">Streamer name or Twitch link</label>
          <input id="add-input" type="text" placeholder="Streamer name or twitch.tv link" spellcheck="false" />
          <button id="add-button" class="btn-primary" type="submit">Add</button>
        </form>
        <div class="tools">
          <button id="import-button" class="btn-ghost" type="button">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" /></svg>
            Import
          </button>
          <button id="export-button" class="btn-ghost" type="button">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 10V2M4.5 5.5 8 2l3.5 3.5M3 13h10" /></svg>
            Export
          </button>
          <input id="import-file" type="file" accept=".json,application/json" hidden />
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>

        <div id="import-panel" class="import-panel" hidden>
          <p id="import-summary" class="import-summary"></p>
          <div class="import-actions">
            <button id="import-add" class="btn-primary" type="button"></button>
            <button id="import-replace" class="btn-secondary" type="button">Replace my list</button>
            <button id="import-cancel" class="btn-ghost" type="button">Cancel</button>
          </div>
        </div>

        <ul id="fav-list" class="fav-list" aria-label="Favorites"></ul>

        <div id="fav-empty" class="empty" hidden>
          <svg class="empty-star" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
            <path d="M12 2.8l2.83 5.73 6.33.92-4.58 4.46 1.08 6.3L12 17.24l-5.66 2.97 1.08-6.3-4.58-4.46 6.33-.92L12 2.8z" />
          </svg>
          <p id="fav-empty-title" class="empty-title">No favorites yet</p>
          <p id="fav-empty-text" class="empty-text">Click the ★ next to Follow on any channel, type a name above, or import a list.</p>
        </div>

        <p id="kick-status" class="hint kick-status" hidden></p>
        <p id="fav-hint" class="hint" hidden>Drag to reorder. Live favorites show in your Twitch sidebar.</p>
      </section>

      <section id="panel-features" role="tabpanel" aria-labelledby="tab-features" hidden>
        <div id="feature-list" class="feature-list"></div>
        <p class="hint">Changes apply to open Twitch tabs right away.</p>
      </section>

      <section id="panel-soon" role="tabpanel" aria-labelledby="tab-soon" hidden>
        <ul id="soon-list" class="soon-list"></ul>
      </section>
    </main>

    <script src="../shared/features.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
